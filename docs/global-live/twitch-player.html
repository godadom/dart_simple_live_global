<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Live — Twitch</title>
<style>html,body{margin:0;background:#000;color:#fff}#player{width:100vw;height:100vh;min-width:400px;min-height:300px}</style>
<div id="player"></div><p id="error"></p>
<script src="https://player.twitch.tv/js/embed/v1.js"></script>
<script>
// Deploy this file to an actual HTTPS origin. No credentials belong here.
const channel = new URL(location.href).searchParams.get('channel') || '';
if (location.protocol !== 'https:' || !/^[a-z0-9_]{1,25}$/.test(channel)) {
  document.getElementById('error').textContent = 'Invalid channel or HTTPS required.';
} else {
  const player = new Twitch.Player('player', {
    channel, parent: [location.hostname], width: '100%', height: '100%', autoplay: false
  });
  player.addEventListener(Twitch.Player.OFFLINE, () => {
    document.getElementById('error').textContent = 'Channel is offline.';
  });
}
</script>
